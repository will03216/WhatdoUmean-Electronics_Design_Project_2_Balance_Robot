<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Robot Control Web UI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center p-6">
	<h1
		class="
		text-6xl font-extrabold 
		bg-gradient-to-r from-green-400 via-blue-500 to-purple-600
		text-transparent bg-clip-text
		drop-shadow-2xl
		transform hover:scale-105
		transition-transform duration-300
		mb-12
		"
	>
		Robot Control Dashboard
	</h1>

  <!-- Control -->
<section class="bg-gray-800 rounded-2xl shadow-lg p-6 mb-12"
        style="
            display: grid;
            grid-template-columns: repeat(3, 80px);
        	grid-template-rows: repeat(2, 80px);
            grid-template-areas:
               '. up .'
               'left down right';
            gap: 1rem;
           ">
    <button id="btn-w" class="btn-control bg-gray-700 hover:bg-gray-600 rounded-lg flex items-center justify-center text-2xl"
            style="grid-area: up;">↑</button>
    <button id="btn-a" class="btn-control bg-gray-700 hover:bg-gray-600 rounded-lg flex items-center justify-center text-2xl"
            style="grid-area: left;">←</button>
    <button id="btn-s" class="btn-control bg-gray-700 hover:bg-gray-600 rounded-lg flex items-center justify-center text-2xl"
            style="grid-area: down;">↓</button>
    <button id="btn-d" class="btn-control bg-gray-700 hover:bg-gray-600 rounded-lg flex items-center justify-center text-2xl"
            style="grid-area: right;">→</button>
</section>

<section class="bg-gray-800 rounded-2xl shadow-lg p-6 w-full max-w-xl flex flex-col sm:flex-row justify-between items-center gap-6 mb-6">
	<!-- Battery -->
	<div class="flex-1 w-full">
	<p class="mb-2 text-sm font-medium text-center">Battery</p>
	<p id="bat-status" class="mb-2 text-center text-xl font-semibold">--%</p>
	<div class="w-full bg-gray-700 rounded-lg overflow-hidden h-4">
		<div id="bat-fill" class="h-full bg-green-500 w-0 transition-all"></div>
	</div>
	</div>
	<!-- Speed -->
	<div class="flex-1 w-full">
	<p class="mb-2 text-sm font-medium text-center">Speed</p>
	<p id="status" class="text-xl font-semibold text-center mb-2">--</p>
	<div class="w-full bg-gray-700 rounded-lg overflow-hidden h-4">
		<div id="speed-fill" class="h-full bg-blue-500 w-0 transition-all"></div>
	</div>
	</div>
</section>
<div class="bg-gray-800 w-full max-w-xl mx-auto shadow-lg p-6 flex flex-col items-center">
	<h2 class="text-4xl font-extrabold bg-gradient-to-r from-green-400 via-blue-500 to-purple-600 text-transparent bg-clip-text drop-shadow-md mb-2">
		AI-Driven Voice Control
	</h2>
	<p class="flex items-center gap-2 text-gray-400">
		Supercharged by
		<img src="https://upload.wikimedia.org/wikipedia/commons/0/04/ChatGPT_logo.svg"
			alt="ChatGPT" class="h-6 w-6 animate-pulse"/>
	</p>
</div>
  <!-- Voice Control -->
<section class="bg-gray-800 w-full max-w-xl mx-auto rounded-b-2xl shadow-lg p-6 flex flex-col items-center gap-4">
	<button id="voice-btn"
			class="bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg">
		Press to Record
	</button>
	<p id="voice-status" class="text-sm text-gray-300">Not Recording</p>
	<p id="chat-response" class="mt-4 text-white text-center text-lg"></p>
</section>
<!-- —— LF and OA —— -->
<section class="bg-gray-800 rounded-2xl shadow-lg p-6 w-full max-w-xl mx-auto flex flex-col sm:flex-row justify-around items-center gap-4 mb-6">
    <button id="btn-line" class="px-4 py-2 bg-red-600 hover:bg-red-500 rounded-lg">
      Line Following: Off
    </button>
    <button id="btn-avoid" class="px-4 py-2 bg-red-600 hover:bg-red-500 rounded-lg">
      Obstacle Avoidance: Off
    </button>
</section>
<section class="bg-gray-800 rounded-2xl shadow-lg p-6 mb-12 flex justify-center gap-4">
  <button id="btn-f"
          class="btn-control bg-gray-700 hover:bg-gray-600 rounded-lg flex items-center justify-center text-2xl">
    F : Turn Left by 90 Degrees
  </button>
  <button id="btn-h"
          class="btn-control bg-gray-700 hover:bg-gray-600 rounded-lg flex items-center justify-center text-2xl">
    H : Turn Right by 90 Degrees
  </button>
  <button id="btn-t"
          class="btn-control bg-gray-700 hover:bg-gray-600 rounded-lg flex items-center justify-center text-2xl">
    T : Go Straight for 30 cm
  </button>
</section>

  <script>
    // —— Control Logic，Single Character ——  
    const held = new Set();
    const opposites = { w:'s', s:'w', a:'d', d:'a' };

    function sendChar(ch) {
      fetch('/api/command', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ cmd: ch })
      }).catch(console.error);
    }

    function updateHold(k) {
      // press and send Character once
      sendChar(k);
    }

    ['w','a','s','d','t','f','h'].forEach(k => {
      const btn = document.getElementById('btn-' + k);
      ['pointerdown','mousedown','touchstart'].forEach(evt =>
        btn.addEventListener(evt, e => { e.preventDefault(); hold(k); })
      );
      ['pointerup','mouseup','touchend','pointerleave'].forEach(evt =>
        btn.addEventListener(evt, e => { e.preventDefault(); release(k); })
      );
    });

window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (['w','a','s','d','t','f','h'].includes(k) && !held.has(k)) {
    e.preventDefault();
    hold(k);
  }
});
window.addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  if (['w','a','s','d','t','f','h'].includes(k)) {
    e.preventDefault();
    release(k);
  }
});


    function hold(k) {
      const opp = opposites[k];
      if (held.has(opp)) release(opp);
      held.add(k);
      document.getElementById('btn-'+k).classList.replace('bg-gray-700','bg-blue-500');
      updateHold(k);
    }

    function release(k) {
      if (!held.has(k)) return;
      held.delete(k);
      document.getElementById('btn-'+k).classList.replace('bg-blue-500','bg-gray-700');
      // release and send 'p'
      sendChar('p');
    }
	
	  // —— Telemetry Fetch ——  
    async function fetchTelemetry() {
      try {
        const res = await fetch('/api/telemetry');
        const tele = await res.json();
        if (tele.bat_v != null) {
          const pct = Math.min(Math.max(tele.bat_v, 0), 100);
          document.getElementById('bat-fill').style.width = `${(pct).toFixed(1)}%`;
          document.getElementById('bat-status').textContent = `${(pct).toFixed(1)}%`;
        }
        if (tele.speed != null) {
          const speed = math.abs(tele.speed);
          document.getElementById('status').textContent = speed;
          const spPct = Math.min(Math.max(speed / 65, 0), 1);
          document.getElementById('speed-fill').style.width = `${(spPct*100).toFixed(1)}%`;
        }
      } catch (e) {
        console.error(e);
      }
    }
    setInterval(fetchTelemetry, 200);

	// Audio Recording and Voice Control
	let micStream = null;
	async function ensureMicAccess() {
		if (micStream) return micStream;
		micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
		return micStream;
	}
  	const VOICE_API = '/api/voice';
	let mediaRecorder = null;
	let audioChunks = [];
	const voiceBtn = document.getElementById('voice-btn');
	const voiceStatus = document.getElementById('voice-status');
	const chatResponse = document.getElementById('chat-response');
	
  	// Hold to Record
  	voiceBtn.addEventListener('mousedown', async () => {
    // Clear previous audio chunks
    audioChunks = [];
    let stream;
    try {
      	// pop up microphone access dialog
      	stream = await ensureMicAccess();
    } catch (err) {
      	console.error('NO ACCESS to MICROPHONE', err);
      	voiceStatus.textContent = 'PLEASE ALLOW MICROPHONE ACCESS';
      	return;
    }
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.start();
    voiceStatus.textContent = 'Recording...';

    mediaRecorder.ondataavailable = (e) => {
      	audioChunks.push(e.data);
    };
  });

  // Release to Stop and Send to backend
	voiceBtn.addEventListener('mouseup', () => {
		console.log("Mouse up, about to stop and send audio");
		if (!mediaRecorder) return;
		mediaRecorder.stop();
		voiceStatus.textContent = 'Uploading...';
		console.log("Recorder stopped, chunks:", audioChunks);

    mediaRecorder.onstop = async () => {
		const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
		const formData = new FormData();
		formData.append('audio', audioBlob, 'voice.webm');

		try {
			const res = await fetch(VOICE_API, {
				method: 'POST', body: formData,});
			if (!res.ok) throw new Error(`HTTP ${res.status}`);
			const data = await res.json();
			// data: { transcription: "...", response: "..." }
			voiceStatus.textContent = 'Recording complete';
			chatResponse.textContent = data.response;
			if ('speechSynthesis' in window) {
				const utter = new SpeechSynthesisUtterance(data.response);
				window.speechSynthesis.speak(utter);
			}
		} catch (err) {
			console.error(err);
			voiceStatus.textContent = 'Recording failed';
		}
    };
  });

  	// Avoid stopping on mouse leave and ensure recording stops
  	voiceBtn.addEventListener('mouseleave', () => {
    	if (mediaRecorder && mediaRecorder.state === 'recording') {
      		mediaRecorder.stop();
      	voiceStatus.textContent = 'Recording stopped';
    }
  });

    // —— Line Following and Obstacle Avoidance ——
    const lineBtn=document.getElementById('btn-line'), avoidBtn=document.getElementById('btn-avoid'); 
	let lineOn=false, avoidOn=false;
    lineBtn.addEventListener('click',()=>{ lineOn=!lineOn; sendChar(lineOn?'l':'k'); 
		lineBtn.textContent=`Line Following: ${lineOn?'On':'Off'}`; 
		lineBtn.classList.toggle('bg-green-500',lineOn); 
		lineBtn.classList.toggle('bg-red-600',!lineOn); });
    avoidBtn.addEventListener('click',()=>{ avoidOn=!avoidOn; sendChar(avoidOn?'o':'i'); 
		avoidBtn.textContent=`Obstacle Avoidance: ${avoidOn?'On':'Off'}`; 
		avoidBtn.classList.toggle('bg-green-500',avoidOn); 
		avoidBtn.classList.toggle('bg-red-600',!avoidOn); });

</script>

</body>
</html>
